name: ÆZ iOS Design

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-design:
    if: "!contains(github.event.head_commit.message, '[aez-ios-design]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Attach visual system safely
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          required = ['<!DOCTYPE html>', 'SUPABASE_URL', 'function login()', 'function submitSignup()', 'function adminLogin()', '</body>', '</html>']
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('ABORTED: missing expected app markers: ' + ', '.join(missing))
          if len(s.splitlines()) < 900:
              raise SystemExit('ABORTED: index.html is unexpectedly short; refusing to rewrite it')
          links = [
              '<link rel="stylesheet" href="aez-ios-design.css">\n',
              '<link rel="stylesheet" href="aez-light-palette.css">\n'
          ]
          changed = False
          for link in links:
              href = link.split('href="',1)[1].split('"',1)[0]
              if href not in s:
                  s = s.replace('</head>', link + '</head>', 1)
                  changed = True
          if changed:
              p.write_text(s, encoding='utf-8')
              print('Attached ÆZ iOS design and aesthetic light palette without changing app logic.')
          else:
              print('Design stylesheets already attached.')
          PY

      - name: Verify
        run: |
          test -s index.html
          test -s aez-ios-design.css
          test -s aez-light-palette.css
          grep -q 'aez-ios-design.css' index.html
          grep -q 'aez-light-palette.css' index.html
          grep -q 'SUPABASE_URL' index.html
          grep -q 'function login()' index.html
          grep -q 'function submitSignup()' index.html
          grep -q 'function adminLogin()' index.html
          test "$(wc -l < index.html)" -ge 900

      - name: Commit design
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html aez-ios-design.css aez-light-palette.css
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m '[aez-ios-design] Apply iOS-style ÆZ visual system'
          git push
